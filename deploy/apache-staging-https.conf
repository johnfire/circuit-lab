<VirtualHost 82.165.32.162:443>
    ServerName staging.circuit-lab.christopherrehm.de
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/staging.circuit-lab.christopherrehm.de/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/staging.circuit-lab.christopherrehm.de/privkey.pem
    SSLCACertificateFile /etc/apache2/circuit-lab-staging-client-ca.pem
    SSLVerifyClient require
    SSLStrictSNIVHostCheck on
    SSLVerifyDepth 1
    Include /etc/letsencrypt/options-ssl-apache.conf
    Header always set X-Robots-Tag "noindex, nofollow"
    Header always set Cache-Control "no-store"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    LimitRequestBody 8192
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 25
    RequestHeader unset X-Circuit-Proxy-Token
    RequestHeader unset X-Circuit-Actor
    RequestHeader unset X-Circuit-Email
    RequestHeader unset X-Circuit-Access-Token
    RequestHeader unset X-Forwarded-User
    RequestHeader unset X-Forwarded-Email
    RequestHeader unset X-Forwarded-Preferred-Username
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Host "staging.circuit-lab.christopherrehm.de"
    <LocationMatch "^/auth/(admin|realms/master)(/|$)">
        Require all denied
    </LocationMatch>
    <Location /mcp>
        LimitRequestBody 65536
    </Location>
    <Location /api/pcb/review>
        LimitRequestBody 1048576
    </Location>
    <Location /api/projects>
        LimitRequestBody 16384
    </Location>
    <Location /_stage/mail/>
        <LimitExcept GET>
            Require all denied
        </LimitExcept>
    </Location>

    ProxyPass /auth/ http://127.0.0.1:8114/auth/
    ProxyPassReverse /auth/ http://127.0.0.1:8114/auth/
    ProxyPass /oauth2/ http://127.0.0.1:8113/oauth2/
    ProxyPassReverse /oauth2/ http://127.0.0.1:8113/oauth2/
    ProxyPass /.well-known/oauth-protected-resource/mcp http://127.0.0.1:8112/.well-known/oauth-protected-resource/mcp
    ProxyPass /mcp http://127.0.0.1:8112/mcp
    ProxyPass /workbench http://127.0.0.1:8113/workbench
    ProxyPassReverse /workbench http://127.0.0.1:8113/workbench
    ProxyPass /api/ http://127.0.0.1:8113/api/
    ProxyPassReverse /api/ http://127.0.0.1:8113/api/
    ProxyPass /assets/ http://127.0.0.1:8113/assets/
    ProxyPassMatch "^/_stage/mail/api/v1/(search|message/[a-zA-Z0-9_-]+)$" "http://127.0.0.1:8056/api/v1/$1"

    DocumentRoot /var/www/circuit-lab-staging-public
    DirectoryIndex landing.html
    <Directory /var/www/circuit-lab-staging-public>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>
    <LocationMatch "^/(landing.html|landing.css)?$">
        Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; connect-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    </LocationMatch>
    ErrorLog ${APACHE_LOG_DIR}/circuit-lab-staging-error.log
    CustomLog ${APACHE_LOG_DIR}/circuit-lab-staging-access.log "%h %t \"%m %U %H\" %>s %b"
</VirtualHost>
