[project]
name = "circuit-lab"
version = "0.1.0"
description = "Local circuit workbench with real ngspice simulations"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
plot = ["matplotlib>=3.9"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.9", "mypy>=1.13", "pip-audit>=2.7"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
files = ["backend"]
strict = true
