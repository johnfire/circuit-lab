name: Circuit Lab checks and deployment

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.12.10"
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install simulator and locked dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex curl ca-certificates
          sudo bash deploy/build_ngspice.sh /usr/local
          uv sync --frozen --all-extras
          npm ci --prefix frontend
          cd frontend
          npx playwright install --with-deps chromium
      - name: Frontend lint and production build
        working-directory: frontend
        run: |
          npm run lint
          npm run test:unit
          npm run test:locale-mutations
          npm run build
      - name: Python lint, strict types, and unit/integration tests
        run: |
          uv run ruff check backend harness tests deploy
          uv run mypy backend deploy
          uv run pytest --cov=backend --cov=harness --cov-report=term-missing --cov-fail-under=70
      - name: Collaboration migration against real PostgreSQL
        run: uv run python -m deploy.project_schema_checks
      - name: Dependency vulnerability scans
        run: |
          uv export --quiet --frozen --no-dev --all-extras --format requirements-txt --output-file /tmp/circuit-lab-requirements.txt
          uv run pip-audit --requirement /tmp/circuit-lab-requirements.txt
          npm audit --prefix frontend --audit-level=high
      - name: Browser, mobile, and accessibility regression tests
        working-directory: frontend
        run: |
          npm run test:e2e
      - name: Retain browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-failures
          path: frontend/test-results
          if-no-files-found: ignore

  containers:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CIRCUIT_PUBLIC_URL: https://circuit-lab.christopherrehm.de
      CIRCUIT_PROXY_TOKEN: container-check-token-not-for-production-123
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Build and start isolated containers
        run: docker compose -p circuit-lab-ci up -d --build --wait --wait-timeout 90
      - name: Real simulations and proxy rejection
        run: docker compose -p circuit-lab-ci exec -T api python - < deploy/container_checks.py
      - name: Real account and identity-bound export integration
        env:
          CIRCUIT_APP_NETWORK: circuit-lab-ci_default
        run: |
          docker compose -p circuit-lab-identity-ci --env-file deploy/identity-test.env -f compose.identity.yaml up -d --build --wait --wait-timeout 180
          python3 deploy/identity_checks.py
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.12.10"
          python-version: "3.13"
      - name: Real MCP token and account lifecycle verification
        run: |
          uv sync --frozen
          uv run python -m deploy.mcp_identity_checks
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Native German and English account screens and emails
        env:
          CIRCUIT_PUBLIC_URL: https://127.0.0.1:8447
          CIRCUIT_APP_NETWORK: circuit-lab-ci_default
          CIRCUIT_SMTP_HOST: test-mail
          CIRCUIT_SMTP_PORT: "1025"
          CIRCUIT_SMTP_STARTTLS: "false"
        run: |
          docker compose -p circuit-lab-ci --env-file deploy/identity-test.env --env-file deploy/identity-language-test.env -f compose.yaml -f compose.projects.yaml up -d --wait --wait-timeout 90
          docker compose -p circuit-lab-identity-ci --env-file deploy/identity-test.env --env-file deploy/identity-language-test.env -f compose.identity.yaml -f compose.staging-identity.yaml up -d --build --wait --wait-timeout 180
          python3 -m deploy.prepare_identity_language_tests
          npm ci --prefix frontend
          cd frontend
          npx playwright install --with-deps chromium
          npm run test:identity-languages
      - name: Retain native account browser diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: identity-language-failures
          path: frontend/test-results/identity
          if-no-files-found: ignore
      - name: Real KiCad board generation and import browser flow
        run: |
          npm run build --prefix frontend
          mkdir -p /tmp/circuit-pcb-ci-socket
          chmod 777 /tmp/circuit-pcb-ci-socket
          docker run -d --name circuit-pcb-ci --network none --read-only --cap-drop ALL --security-opt no-new-privileges --memory 768m --pids-limit 64 --tmpfs /tmp:rw,nosuid,size=128m,mode=1777 -v /tmp/circuit-pcb-ci-socket:/run/circuit-pcb circuit-lab-pcb-worker:local
          for attempt in $(seq 1 30); do test -S /tmp/circuit-pcb-ci-socket/pcb.sock && break; sleep 1; done
          docker exec --user 10001:10001 circuit-pcb-ci chmod 666 /run/circuit-pcb/pcb.sock
          CIRCUIT_PCB_SOCKET=/tmp/circuit-pcb-ci-socket/pcb.sock npm run test:pcb --prefix frontend
      - name: Retain PCB browser diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pcb-browser-failures
          path: frontend/test-results
          if-no-files-found: ignore
      - name: Stop isolated PCB test worker
        if: always()
        run: docker stop circuit-pcb-ci || true
      - name: Verify worker isolation
        run: |
          worker=$(docker compose -p circuit-lab-ci ps -q worker)
          test "$(docker inspect -f '{{.HostConfig.NetworkMode}}' "$worker")" = none
          test "$(docker inspect -f '{{.HostConfig.ReadonlyRootfs}}' "$worker")" = true
          test "$(docker inspect -f '{{.Config.User}}' "$worker")" = 10001:10001
          pcb_worker=$(docker compose -p circuit-lab-ci ps -q pcb-worker)
          test "$(docker inspect -f '{{.HostConfig.NetworkMode}}' "$pcb_worker")" = none
          test "$(docker inspect -f '{{.HostConfig.ReadonlyRootfs}}' "$pcb_worker")" = true
          test "$(docker inspect -f '{{.Config.User}}' "$pcb_worker")" = 10001:10001
          docker compose -p circuit-lab-ci exec -T worker python -c "import socket; connection=socket.socket(); connection.settimeout(2); assert connection.connect_ex(('1.1.1.1', 443)) != 0; print('Worker outbound network is blocked')"
      - name: Container failure diagnostics
        if: failure()
        env:
          CIRCUIT_APP_NETWORK: circuit-lab-ci_default
        run: |
          docker compose -p circuit-lab-ci logs --tail 80
          docker compose -p circuit-lab-identity-ci --env-file deploy/identity-test.env -f compose.identity.yaml logs --tail 40
      - name: Stop CI-only containers
        if: always()
        env:
          CIRCUIT_APP_NETWORK: circuit-lab-ci_default
        run: |
          docker compose -p circuit-lab-identity-ci --env-file deploy/identity-test.env -f compose.identity.yaml -f compose.staging-identity.yaml down
          docker compose -p circuit-lab-ci --env-file deploy/identity-test.env --env-file deploy/identity-language-test.env -f compose.yaml -f compose.projects.yaml down

  deploy:
    needs: containers
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: circuit-lab-production
      cancel-in-progress: false
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Configure restricted VPS receiver
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_HOST_KEY"
          umask 077
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/circuit-lab"
          printf '%s\n' "$DEPLOY_HOST_KEY" > "$HOME/.ssh/circuit-lab-known-hosts"
          cat > "$HOME/.ssh/circuit-lab-config" <<'SSH'
          Host circuit-lab-vps
              HostName 82.165.32.162
              User circuit-deploy
              IdentityFile ~/.ssh/circuit-lab
              UserKnownHostsFile ~/.ssh/circuit-lab-known-hosts
              IdentitiesOnly yes
              BatchMode yes
              StrictHostKeyChecking yes
              ConnectTimeout 15
          SSH
      - name: Build the verified revision and deploy staging
        run: git archive "$GITHUB_SHA" | ssh -F "$HOME/.ssh/circuit-lab-config" circuit-lab-vps "stage $GITHUB_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install staging test dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Gate production on the live staging browser
        working-directory: frontend
        env:
          STAGING_TLS_CERT: ${{ secrets.STAGING_TLS_CERT }}
          STAGING_TLS_KEY: ${{ secrets.STAGING_TLS_KEY }}
          CIRCUIT_EXPECTED_BUILD: ${{ github.sha }}
        run: |
          if curl --fail --silent --max-time 10 https://staging.circuit-lab.christopherrehm.de/ >/dev/null; then
            echo 'Staging requires a TLS client certificate'
            exit 1
          fi
          npm run test:staging
      - name: Promote the same images to production
        run: ssh -n -F "$HOME/.ssh/circuit-lab-config" circuit-lab-vps "promote $GITHUB_SHA"
      - name: Verify public landing and protected workbench
        run: |
          test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' https://circuit-lab.christopherrehm.de/)" = 200
          test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' https://circuit-lab.christopherrehm.de/favicon.svg)" = 200
          test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' https://circuit-lab.christopherrehm.de/theme.css)" = 200
          test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' https://circuit-lab.christopherrehm.de/landing-analytics.js)" = 200
          test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' https://circuit-lab.christopherrehm.de/workbench)" = 302
          test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' https://circuit-lab.christopherrehm.de/auth/admin/)" = 403
