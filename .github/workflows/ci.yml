name: Prototype checks

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.12.10"
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install simulator and locked dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ngspice
          uv sync --frozen --all-extras
          npm ci --prefix frontend
      - name: Python lint, strict types, and unit/integration tests
        run: |
          uv run ruff check backend harness tests
          uv run mypy backend
          uv run pytest --cov=backend --cov=harness --cov-report=term-missing --cov-fail-under=70
      - name: Frontend lint and production build
        working-directory: frontend
        run: |
          npm run lint
          npm run build
      - name: Dependency vulnerability scans
        run: |
          uv export --quiet --frozen --no-dev --all-extras --format requirements-txt --output-file /tmp/circuit-lab-requirements.txt
          uv run pip-audit --requirement /tmp/circuit-lab-requirements.txt
          npm audit --prefix frontend --audit-level=high
      - name: Browser, mobile, and accessibility regression tests
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Retain browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures
          path: frontend/test-results
          if-no-files-found: ignore
