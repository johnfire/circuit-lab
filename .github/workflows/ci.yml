name: Circuit Lab checks and deployment

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.12.10"
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install simulator and locked dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex curl ca-certificates
          sudo bash deploy/build_ngspice.sh /usr/local
          uv sync --frozen --all-extras
          npm ci --prefix frontend
      - name: Python lint, strict types, and unit/integration tests
        run: |
          uv run ruff check backend harness tests deploy
          uv run mypy backend deploy
          uv run pytest --cov=backend --cov=harness --cov-report=term-missing --cov-fail-under=70
      - name: Frontend lint and production build
        working-directory: frontend
        run: |
          npm run lint
          npm run test:unit
          npm run build
      - name: Dependency vulnerability scans
        run: |
          uv export --quiet --frozen --no-dev --all-extras --format requirements-txt --output-file /tmp/circuit-lab-requirements.txt
          uv run pip-audit --requirement /tmp/circuit-lab-requirements.txt
          npm audit --prefix frontend --audit-level=high
      - name: Browser, mobile, and accessibility regression tests
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Retain browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-failures
          path: frontend/test-results
          if-no-files-found: ignore

  containers:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CIRCUIT_PUBLIC_URL: https://circuit-lab.christopherrehm.de
      CIRCUIT_PROXY_TOKEN: container-check-token-not-for-production-123
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Build and start isolated containers
        run: docker compose -p circuit-lab-ci up -d --build --wait --wait-timeout 90
      - name: Real simulations and proxy rejection
        run: docker compose -p circuit-lab-ci exec -T api python - < deploy/container_checks.py
      - name: Real account and identity-bound export integration
        env:
          CIRCUIT_APP_NETWORK: circuit-lab-ci_default
        run: |
          docker compose -p circuit-lab-identity-ci --env-file deploy/identity-test.env -f compose.identity.yaml up -d --build --wait --wait-timeout 180
          python3 deploy/identity_checks.py
      - name: Verify worker isolation
        run: |
          worker=$(docker compose -p circuit-lab-ci ps -q worker)
          test "$(docker inspect -f '{{.HostConfig.NetworkMode}}' "$worker")" = none
          test "$(docker inspect -f '{{.HostConfig.ReadonlyRootfs}}' "$worker")" = true
          test "$(docker inspect -f '{{.Config.User}}' "$worker")" = 10001:10001
          docker compose -p circuit-lab-ci exec -T worker python -c "import socket; connection=socket.socket(); connection.settimeout(2); assert connection.connect_ex(('1.1.1.1', 443)) != 0; print('Worker outbound network is blocked')"
      - name: Container failure diagnostics
        if: failure()
        env:
          CIRCUIT_APP_NETWORK: circuit-lab-ci_default
        run: |
          docker compose -p circuit-lab-ci logs --tail 80
          docker compose -p circuit-lab-identity-ci --env-file deploy/identity-test.env -f compose.identity.yaml logs --tail 40
      - name: Stop CI-only containers
        if: always()
        env:
          CIRCUIT_APP_NETWORK: circuit-lab-ci_default
        run: |
          docker compose -p circuit-lab-identity-ci --env-file deploy/identity-test.env -f compose.identity.yaml down
          docker compose -p circuit-lab-ci down

  deploy:
    needs: containers
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: circuit-lab-production
      cancel-in-progress: false
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Send exact verified revision to restricted VPS receiver
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_HOST_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/circuit-lab"
          chmod 600 "$HOME/.ssh/circuit-lab"
          printf '%s\n' "$DEPLOY_HOST_KEY" > "$HOME/.ssh/known_hosts"
          git archive "$GITHUB_SHA" | ssh -F /dev/null -i "$HOME/.ssh/circuit-lab" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 circuit-deploy@82.165.32.162 "deploy $GITHUB_SHA"
      - name: Verify public landing and protected workbench
        run: |
          test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' https://circuit-lab.christopherrehm.de/)" = 200
          test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' https://circuit-lab.christopherrehm.de/favicon.svg)" = 200
          test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' https://circuit-lab.christopherrehm.de/theme.css)" = 200
          test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' https://circuit-lab.christopherrehm.de/landing-analytics.js)" = 200
          test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' https://circuit-lab.christopherrehm.de/workbench)" = 302
          test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' https://circuit-lab.christopherrehm.de/auth/admin/)" = 403
